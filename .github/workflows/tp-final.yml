# CI del TP final (movierec): tests de cada servicio y escaneo de vulnerabilidades.
# Corre solo si cambia algo en tp-final/. Los tests de los servicios corren dentro del build de sus imágenes
# (etapa `test` de cada Dockerfile), igual que `make test` en local.
name: tp-final

on:
  push:
    paths: ["tp-final/**", ".github/workflows/tp-final.yml"]
  pull_request:
    paths: ["tp-final/**", ".github/workflows/tp-final.yml"]

defaults:
  run:
    working-directory: tp-final

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del venv trainer (torch CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r platform/airflow/trainer-requirements.txt -r platform/airflow/trainer-extra-requirements.txt
      - name: pytest movierec_ml
        working-directory: tp-final/ml
        run: python -m pytest -q -p no:cacheprovider

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [recommender, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Tests (corren en el build, etapa test del Dockerfile)
        run: docker build -f services/${{ matrix.service }}/Dockerfile --target test .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests, typecheck y build del frontend
        run: docker build -f services/web/Dockerfile --target build .

  scan:
    runs-on: ubuntu-latest
    needs: [services, web]
    strategy:
      matrix:
        service: [recommender, gateway, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen de runtime
        run: docker build -f services/${{ matrix.service }}/Dockerfile --target runtime -t movierec/${{ matrix.service }}:ci .
      - name: Trivy (bloquea CRITICAL con fix disponible)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: movierec/${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: tp-final/.trivyignore
