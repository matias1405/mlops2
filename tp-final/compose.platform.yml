# Plataforma ML compartida por los ambientes dev y prod.
# Uso: make up-platform   (equivale a docker compose -p movierec-platform -f compose.platform.yml
#                          --env-file platform.env up -d)
#
# Convenciones:
# - Sin container_name: el proyecto (-p) da el prefijo y permite convivir con movierec-dev / movierec-prod.
# - Los puertos se publican solo en 127.0.0.1 (salvo Keycloak, público). La API de MinIO no se publica.
# - Cada servicio usa su propio usuario de Postgres y de MinIO (nadie usa root salvo los init).

name: movierec-platform

# Hardening para servicios que no necesitan cambiar de usuario al arrancar.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-airflow-common: &airflow-common
  # La imagen la construye solo airflow-init (build:); webserver y scheduler la reusan.
  image: movierec/airflow:2.10.4
  pull_policy: never
  restart: unless-stopped
  # shared: para que validate_dev llegue al api-gateway de DEV (gateway-dev).
  networks: [ml_platform, shared]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Los DAGs arrancan activos: bootstrap (@once) corre solo al primer arranque y encadena descarga,
    # ingesta y entrenamiento; el resto se dispara desde la UI.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Fuente del dataset para la primera carga (kaggle | local | sample) y commit del código (tag de cada run).
    MOVIEREC_BOOTSTRAP_SOURCE: ${MOVIEREC_BOOTSTRAP_SOURCE:-kaggle}
    MOVIEREC_GIT_SHA: ${MOVIEREC_GIT_SHA:-unknown}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    # Tracking y artefactos por HTTP contra el server de MLflow (--serve-artifacts).
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Acceso al data lake con el usuario 'airflow' de MinIO (sin acceso a mlflow-artifacts).
    # Se usan nombres propios (no AWS_*) para que el cliente de MLflow nunca intente ir directo a S3.
    S3_ENDPOINT_URL: http://minio:9000
    LAKE_ACCESS_KEY: airflow
    LAKE_SECRET_KEY: ${MINIO_AIRFLOW_SECRET}
    TRAINER_PYTHON: /opt/venvs/trainer/bin/python
    PYTHONPATH: /opt/airflow/ml/src
    # Login de la UI con Keycloak (platform/airflow/webserver_config.py).
    KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KC_AIRFLOW_CLIENT_ID: airflow
    KC_AIRFLOW_CLIENT_SECRET: ${KC_AIRFLOW_CLIENT_SECRET}
    # Service account para Reload de los recommenders (fases 4 y 8).
    KC_AIRFLOW_DEPLOYER_SECRET: ${KC_AIRFLOW_DEPLOYER_SECRET}
    # Smoke tests de validate_dev contra DEV.
    KC_QA_BOT_SECRET: ${KC_QA_BOT_SECRET}
    # Sincronización del catálogo de cada ambiente (DAG sync_catalog / train_movierec).
    APP_DEV_DB_PASSWORD: ${APP_DEV_DB_PASSWORD}
    APP_PROD_DB_PASSWORD: ${APP_PROD_DB_PASSWORD}
  volumes: &airflow-volumes
    - ./platform/airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - ./platform/airflow/init_roles.py:/opt/airflow/init_roles.py:ro
    - ./ml/dags:/opt/airflow/dags:ro
    - ./ml:/opt/airflow/ml:ro
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs

services:
  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    networks: [ml_platform, shared]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # En un disco lento, apagar el servidor temporal de la inicialización puede tardar más que los 60 s por
      # defecto de pg_ctl: sin esto el contenedor se reinicia y tiene que recuperarse del WAL.
      PGCTLTIMEOUT: "300"
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      APP_DEV_DB_PASSWORD: ${APP_DEV_DB_PASSWORD}
      APP_PROD_DB_PASSWORD: ${APP_PROD_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./platform/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: el servidor temporal de la inicialización solo escucha en el socket local, así que el
      # healthcheck no da OK hasta que arranca el servidor definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ------------------------------------------------------------------- MinIO
  # Ajusta el dueño del volumen para que MinIO corra sin root (idempotente, termina enseguida).
  minio-permissions:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: "no"
    network_mode: none
    entrypoint: ["sh", "-c", "chown -R 1001:1001 /data && echo 'minio-data -> 1001:1001'"]
    volumes:
      - minio-data:/data

  minio:
    <<: *hardened
    user: "1001:1001"
    # MinIO dejó de publicar imágenes community (Docker Hub / quay.io). Se usa el fork pgsty/minio
    # (mismo binario, AGPL), pineado por digest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address :9001
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    networks: [ml_platform, shared, media]
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      HOME: /tmp   # mc (healthcheck) guarda su config en $HOME; sin root no puede usar /root
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Job de inicialización: buckets, versionado, policies y usuarios por servicio.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    networks: [ml_platform]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_AIRFLOW_SECRET: ${MINIO_AIRFLOW_SECRET}
      MINIO_MLFLOW_SECRET: ${MINIO_MLFLOW_SECRET}
      MINIO_GATEWAY_DEV_SECRET: ${MINIO_GATEWAY_DEV_SECRET}
      MINIO_GATEWAY_PROD_SECRET: ${MINIO_GATEWAY_PROD_SECRET}
    volumes:
      - ./platform/minio/init.sh:/init.sh:ro
      - ./platform/minio/policies:/policies:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # ------------------------------------------------------------------ MLflow
  mlflow:
    <<: *hardened
    build: ./platform/mlflow
    image: movierec/mlflow:2.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Sin puertos publicados: la UI se accede vía oauth2-proxy (login con Keycloak).
    networks: [ml_platform]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflow
      AWS_SECRET_ACCESS_KEY: ${MINIO_MLFLOW_SECRET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ----------------------------------------------------------------- Airflow
  # Migraciones + usuario admin local. Corre una vez y termina.
  airflow-init:
    <<: *airflow-common
    build: ./platform/airflow
    pull_policy: build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # Migraciones + rol a medida (DataScientist) + permisos por DAG (access_control).
    # Los usuarios de la UI se crean en su primer login con Keycloak.
    command: ["bash", "-c", "airflow db migrate && python /opt/airflow/init_roles.py && airflow sync-perm --include-dags"]

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------- Keycloak
  # Identidad (OIDC). Realms platform (equipo) y movierec (usuarios finales) importados al arrancar;
  # los secretos de los JSON son placeholders ${VAR} resueltos desde estas variables de entorno.
  keycloak:
    <<: *hardened
    image: quay.io/keycloak/keycloak:26.5@sha256:45ae20191531eb608ddb0b775d012b40d3e4f942697f3214694887dd7c108d13
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ml_platform, shared]
    ports:
      # Público: los usuarios finales de prod hacen login acá.
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Issuer único para navegador y servicios; los servicios entran por http://keycloak:8080.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Una sola instancia: cache local (sin cluster JDBC_PING, que tras un reinicio
      # intenta unirse al nodo anterior registrado en la base y se cuelga).
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KC_AIRFLOW_CLIENT_SECRET: ${KC_AIRFLOW_CLIENT_SECRET}
      KC_MLFLOW_PROXY_CLIENT_SECRET: ${KC_MLFLOW_PROXY_CLIENT_SECRET}
      KC_AIRFLOW_DEPLOYER_SECRET: ${KC_AIRFLOW_DEPLOYER_SECRET}
      KC_QA_BOT_SECRET: ${KC_QA_BOT_SECRET}
    volumes:
      - ./platform/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      # La imagen no trae curl: request HTTP crudo al puerto de management (9000).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # oauth2-proxy delante de la UI de MLflow: solo roles DE/DS/MLE del realm platform.
  # Discovery deshabilitado: el issuer es la URL pública, pero los endpoints de backchannel
  # se resuelven por la red interna.
  mlflow-proxy:
    <<: *hardened
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks: [ml_platform]
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:4180"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://mlflow:5000
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_CLIENT_ID: mlflow-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${KC_MLFLOW_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_NAME: _mlflow_proxy
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:${MLFLOW_PORT}/oauth2/callback
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/platform
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: ${KEYCLOAK_PUBLIC_URL}/realms/platform/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/certs
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/userinfo
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_ROLES: ml-engineer,data-scientist
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "true"

networks:
  # Nombres fijos: los proyectos movierec-dev / movierec-prod se conectan a ellas como 'external'.
  ml_platform:
    name: movierec_ml_platform
  shared:
    name: movierec_shared
  media:
    name: movierec_media

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
