<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 60" role="img" aria-label="MovieRec">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#7a45e6"/>
    </linearGradient>
    <clipPath id="barra">
      <rect x="4" y="6" width="48" height="11" rx="2.5" transform="rotate(-12 4 17)"/>
    </clipPath>
  </defs>
  <!-- Claqueta: barra superior con rayas -->
  <g clip-path="url(#barra)">
    <rect x="0" y="-8" width="64" height="30" fill="#efe7ff"/>
    <g fill="#5a2db8">
      <polygon points="10,-8 18,-8 10,26 2,26"/>
      <polygon points="26,-8 34,-8 26,26 18,26"/>
      <polygon points="42,-8 50,-8 42,26 34,26"/>
      <polygon points="58,-8 66,-8 58,26 50,26"/>
    </g>
  </g>
  <!-- Cuerpo: un fotograma con perforaciones y el play -->
  <rect x="4" y="19" width="48" height="34" rx="6" fill="url(#cuerpo)"/>
  <g fill="#2a0d57" opacity="0.85">
    <rect x="9" y="25" width="6" height="5" rx="1.2"/>
    <rect x="9" y="33.5" width="6" height="5" rx="1.2"/>
    <rect x="9" y="42" width="6" height="5" rx="1.2"/>
  </g>
  <path d="M25 26.5v19.5l15.5-9.75z" fill="#2a0d57"/>
  <!-- Estrella -->
  <path d="M51 35.5l3.3 6.8 7.5 1.1-5.4 5.3 1.3 7.4-6.7-3.5-6.7 3.5 1.3-7.4-5.4-5.3 7.5-1.1z"
        fill="#f9cf3e" stroke="#2a0d57" stroke-width="2" stroke-linejoin="round"/>
</svg>
